name: finsight_ai
description: "FinSight AI – smarter spending, better rewards and AI agents for your finances (MVP)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Renders the design's stroke icons from their original SVG path data. MIT.
  flutter_svg: ^2.3.0
  # Remembers the signed-in demo account between launches. BSD-3-Clause.
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generate the native app icons and splash screens from branding/. MIT.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/data/

  # Inter, the typeface used throughout the design (SIL Open Font License 1.1,
  # see assets/fonts/OFL.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# App icon: the Welcome screen's frosted logo tile on the warm gradient.
# Artwork is rendered from branding/src by branding/render.sh.
flutter_launcher_icons:
  image_path: branding/icon.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: branding/icon_background.png
  adaptive_icon_foreground: branding/icon_foreground.png
  min_sdk_android: 21

# Launch screen: the Welcome gradient with the FinSight logo, so the first
# Flutter frame continues it seamlessly.
flutter_native_splash:
  background_image: branding/splash_background.png
  image: branding/splash_logo.png
  android_12:
    image: branding/splash_android12.png
    color: "#8E2A0C"
  web: false
